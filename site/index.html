<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FF7A5C">
<title>Anjos de Focinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* VOICE: carinhoso e prático — um caderno de cuidados dos cães, sem enfeite.
   IDEA: a carteirinha de vacinação do pet: capa em degradê laranja-rosa, páginas brancas com carimbos de data.
   PICTURE: o cabeçalho do pet é a capa da carteirinha (foto grande, nome, selos); no início, a fileira de focinhos.
   COLOUR and TYPE: laranja #F26B2E → rosa #FF5E8A (a marca do app), tinta marrom #2B1D14, papel #FFF8F3; Nunito.
   LAYOUT: celular = coluna única + barra inferior; computador = menu lateral fixo + grades de 2–3 colunas. */
:root{color-scheme:light dark;
--bg:light-dark(#FFF8F3,#14110F);--card:light-dark(#FFFFFF,#221D1A);--card2:light-dark(#F7ECE4,#2E2723);
--ink:light-dark(#2B1D14,#F3ECE7);--sub:light-dark(#7A6558,#B7A79C);--line:light-dark(#EFE2D8,#3A322D);
--ac:light-dark(#F26B2E,#FFA172);--acSoft:light-dark(#FFE2D2,#5A2E18);--ok:#10B981;--warn:#F59E0B;--bad:#EF4444;
--g1:#FF8A4C;--g2:#FF5E8A;--r:20px;--sh:0 1px 2px rgba(60,30,10,.06),0 6px 18px rgba(60,30,10,.06)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:4px 10px 20px}
.logo i{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--sub);text-decoration:none;font-weight:700;border:0;background:none;text-align:left;min-height:44px}
.nav svg{width:22px;height:22px;flex:none}
.nav.on{background:var(--acSoft);color:var(--ac)}
.nav:hover{color:var(--ink)}
.main{padding:24px clamp(16px,3vw,40px) 110px;max-width:1240px;width:100%}
.bottom{display:none}
@media(max-width:899px){
 .app{display:block}.side{display:none}
 .main{padding:14px 14px 100px}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bottom .nav{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center}
}
h1{font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:19px;margin:26px 0 8px;font-weight:800}
h3{font-size:16px;margin:0 0 6px;font-weight:800}
.sub{color:var(--sub);font-size:14px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.top .grow{flex:1 1 220px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.click{cursor:pointer;transition:transform .12s}.click:active{transform:scale(.985)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gpets{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
@media(max-width:899px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.gpets{grid-template-columns:minmax(0,1fr)}}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
.tile .e{font-size:20px}.tile b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile small{color:var(--sub);font-size:13px}
.btn{border:0;border-radius:999px;padding:0 20px;min-height:46px;font-weight:800;background:var(--card2);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 14px rgba(255,94,138,.35)}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.icon{border:0;background:none;font-size:20px;min-width:44px;min-height:44px;border-radius:12px}
.icon:hover{background:var(--card2)}
.fab{position:fixed;right:24px;bottom:28px;z-index:15}
@media(max-width:899px){.fab{bottom:84px;right:16px}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--card2);font-size:14px;font-weight:600;min-height:38px;white-space:nowrap}
.chip.on{background:var(--acSoft);color:var(--ac);font-weight:800}
.focinhos{display:flex;gap:12px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}
.focinho{flex:none;width:70px;border:0;background:none;text-align:center;font-size:12px;color:var(--sub);font-weight:700;padding:0}
.focinho .ring{width:60px;height:60px;margin:0 auto 4px;border-radius:50%;padding:2px;background:var(--line)}
.focinho.on{color:var(--ink)}.focinho.on .ring{padding:3px;background:linear-gradient(135deg,var(--g1),var(--g2))}
.focinho span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;background:linear-gradient(135deg,#FFB38A,#FF7A9C);flex:none;overflow:hidden;width:100%;height:100%}
.av img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1}
.pet{display:flex;gap:14px;align-items:center}
.pet .nm{font-size:19px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pet .l{font-size:13px;color:var(--sub)}
.st{font-size:13px;font-weight:800}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:10px;white-space:nowrap}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:18px;padding:12px 14px;margin-top:8px;box-shadow:var(--sh)}
.item .grow{flex:1}
.item .t{font-weight:800}
.item .m{font-size:13px;color:var(--sub)}
.item .d{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .v{font-weight:800;white-space:nowrap;text-align:right}
.done{width:42px;height:42px;border-radius:14px;border:0;background:var(--acSoft);color:var(--ac);font-size:20px;font-weight:800;flex:none}
.emo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none;border:2px solid}
.mes{font-size:13px;font-weight:800;color:var(--ac);margin:18px 4px 2px;display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--sub);padding:40px 20px}
.capa{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:28px;padding:50px 20px 22px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}
.capa::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.capa .foto{width:104px;height:104px;border-radius:50%;padding:4px;background:#fff;flex:none}
.capa h1{color:#fff}
.capa .acts{position:absolute;top:10px;right:10px;display:flex;z-index:1}
.capa .acts button,.capa .voltar{color:#fff}
.capa .voltar{position:absolute;left:8px;top:10px;z-index:1;font-size:24px}
.selo{display:inline-block;background:rgba(255,255,255,.22);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:800;margin:6px 6px 0 0}
@media(max-width:600px){.capa{flex-direction:column;text-align:center;padding-top:44px}.capa .foto{width:96px;height:96px}}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:6px}
.brow{padding:8px 0}
.brow .row{font-size:14px}
.brow .row span:last-child{color:var(--sub);white-space:nowrap}
.dark{background:linear-gradient(135deg,#2B1D14,#5A2E18);color:#fff}
.dark .sub{color:rgba(255,255,255,.75)}
.big{font-size:clamp(28px,5vw,36px);font-weight:800;line-height:1.1}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 14px;font-size:14px;margin-top:8px}
.kv dt{color:var(--sub)}.kv dd{margin:0;font-weight:700;text-align:right;overflow-wrap:anywhere}
.fig{position:relative;height:190px;margin-top:10px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
label.f{display:block;font-size:13px;font-weight:800;color:var(--sub);margin:14px 2px 6px}
label.f em{font-style:normal;font-weight:600;opacity:.8}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:16px;min-height:48px}
.in:focus,.btn:focus-visible,.chip:focus-visible,.nav:focus-visible,.icon:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea.in{min-height:96px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--ac)}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
@media(max-width:700px){.form2{grid-template-columns:minmax(0,1fr)}}
.span2{grid-column:1/-1}
.ffoto{display:flex;align-items:center;gap:16px;margin-top:6px}
.ffoto .foto{width:96px;height:96px}
.modal{position:fixed;inset:0;background:rgba(20,10,5,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border-radius:24px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 20px 16px}
.box .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;position:sticky;bottom:-16px;background:var(--card);padding:10px 0 4px}
@media(max-width:600px){.modal{align-items:flex-end;padding:0}.box{border-radius:24px 24px 0 0;max-height:92vh}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2B1D14;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;font-weight:700;box-shadow:var(--sh);max-width:90vw}
.qr{background:#fff;border-radius:16px;padding:12px;width:max-content;margin:12px auto}
.qr svg,.qr img{display:block;width:220px;height:220px}
pre.prev{white-space:pre-wrap;background:var(--card2);border-radius:12px;padding:10px 12px;font:13px/1.45 Nunito,sans-serif;margin:10px 0 0}
.cart{border-radius:24px;overflow:hidden;background:linear-gradient(135deg,var(--g1),var(--g2));padding:16px;color:#fff;max-width:640px}
.cart .in2{background:#fff;color:#2B1D14;border-radius:18px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.cart .in2 .qr{margin:0;padding:0}.cart .in2 .qr svg{width:120px;height:120px}
@media(max-width:600px){.cart .in2{grid-template-columns:minmax(0,1fr);text-align:center}.cart .in2 .av{margin:0 auto}}
.note{font-size:13px;color:var(--sub);margin-top:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.bottom,.fab,.capa .acts,.chips,.noprint{display:none!important}.app{display:block}body{background:#fff}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><circle cx="4.5" cy="9.5" r="2.5"/><circle cx="9" cy="5.5" r="2.5"/><circle cx="15" cy="5.5" r="2.5"/><circle cx="19.5" cy="9.5" r="2.5"/><path d="M17.3 14.9c-.9-1-1.6-1.9-2.5-2.9-.5-.5-1-1.1-1.7-1.3a4 4 0 0 0-2.2 0c-.7.2-1.3.8-1.7 1.3-.9 1-1.6 1.9-2.5 2.9-1.3 1.3-2.9 2.8-2.6 4.8.3 1 1 2 2.3 2.3.7.2 3.1-.4 5.5-.4h.2c2.5 0 4.8.6 5.5.4 1.3-.3 2-1.3 2.3-2.3.3-2-1.3-3.5-2.6-4.8z"/></svg></i>Anjos de Focinho</div>
    <nav id="navSide"></nav>
  </aside>
  <main class="main" id="tela"></main>
</div>
<nav class="bottom" id="navBot"></nav>
<div id="camada"></div>
<input type="file" id="arquivo" accept="image/*" hidden>
<input type="file" id="arquivoBackup" accept=".json,application/json" hidden>

<script>
{
/* =====================================================================
   DADOS — mesmo formato do backup do app Android (dá para importar um no outro).
   Hoje tudo fica no navegador (localStorage). Para integrar depois, troque as
   funções de Integracao (carregar/salvar) por chamadas à sua API (ex.: Apps Script).
   ===================================================================== */
const CHAVE = 'anjos_de_focinho_v1';
const Integracao = {
  // chamado depois de cada alteração com o estado completo — ponto para enviar ao servidor
  salvar(estado) {},
  // chamado ao abrir — pode devolver um estado vindo do servidor (ou null)
  carregar() { return null; }
};
let E = { pets: [], registros: [], lembretes: [], fotos: {}, proxId: 1, tema: 'sistema' };
function carregar() {
  try { const s = localStorage.getItem(CHAVE); if (s) E = Object.assign(E, JSON.parse(s)); } catch (e) {}
  const r = Integracao.carregar(); if (r) E = Object.assign(E, r);
}
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(E)); } catch (e) { toast('Sem espaço para salvar no navegador. Use fotos menores.'); }
  Integracao.salvar(E);
}
function novoId() { const id = Math.max(E.proxId || 1, Math.floor(Date.now() / 1000)); E.proxId = id + 1; return id; }

const TIPOS = ['consulta','vacina','procedimento','exame','medicamento','banho','peso','outro'];
const NOMES = ['Consulta','Vacina','Procedimento','Exame','Medicamento','Banho e tosa','Peso','Outro'];
const EMO = ['🩺','💉','🏥','🔬','💊','🛁','⚖️','📝'];
const COR = ['#3B82F6','#10B981','#EF4444','#8B5CF6','#F59E0B','#06B6D4','#64748B','#A16207'];
const ti = t => Math.max(0, TIPOS.indexOf(t));
const RACAS = ['SRD (vira-lata)','Shih Tzu','Yorkshire','Poodle','Lhasa Apso','Spitz Alemão (Lulu)','Pinscher','Maltês','Bulldog Francês','Bulldog Inglês','Golden Retriever','Labrador','Pastor Alemão','Border Collie','Beagle','Dachshund (Salsicha)','Pug','Rottweiler','Husky Siberiano','Chihuahua','Pit Bull','American Bully','Boxer','Cocker Spaniel','Schnauzer','Dálmata','Chow Chow','Akita','Shiba Inu','Doberman','Pastor Belga','Bernese','Cavalier King Charles','Bichon Frisé','Jack Russell','Weimaraner','Fila Brasileiro','Basset Hound','Corgi','Samoieda'];
const UFS = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const VACINAS = ['V8 (Polivalente)','V10 (Polivalente)','Antirrábica','Gripe canina (Tosse dos canis)','Giárdia','Leishmaniose','V5','Reforço anual V10','Reforço antirrábica'];
const PROCED = ['Castração','Limpeza de tártaro','Cirurgia','Curativo','Retirada de pontos','Aplicação de medicamento','Soroterapia','Microchipagem','Extração dentária','Internação'];
const EXAMES = ['Hemograma','Bioquímico','Ultrassom','Raio-X','Urina','Fezes (coproparasitológico)','Ecocardiograma','Teste de Leishmaniose','Teste de Cinomose','Glicemia'];
const MEDIC = ['Vermífugo','Antipulgas','Carrapaticida','Antibiótico','Anti-inflamatório','Vitamina / suplemento','Colírio','Pomada'];
const BANHO = ['Banho','Banho e tosa','Tosa higiênica','Tosa completa','Hidratação','Corte de unhas'];

/* ===================================================================== utilidades */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reais = c => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
function centavos(s) { s = String(s || '').replace(/R\$|\s/g, ''); if (!s) return 0; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const v = parseFloat(s); return isNaN(v) ? -1 : Math.round(v * 100); }
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoje = () => iso(new Date());
const dt = s => { if (!s || s.length < 10) return null; const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const br = s => s && s.length >= 10 ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const curta = s => { const d = dt(s); return d ? d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear() : ''; };
const diasAte = s => { const d = dt(s); if (!d) return 0; return Math.round((d - dt(hoje())) / 864e5); };
function somarDias(s, n) { const d = dt(s) || new Date(); d.setDate(d.getDate() + n); return iso(d); }
function relativo(s) {
  const d = diasAte(s); if (d === 0) return 'hoje'; if (d === 1) return 'amanhã'; if (d === -1) return 'ontem';
  const a = Math.abs(d); const t = a < 31 ? a + ' dias' : a < 365 ? Math.floor(a / 30) + (Math.floor(a / 30) === 1 ? ' mês' : ' meses') : Math.floor(a / 365) + (Math.floor(a / 365) === 1 ? ' ano' : ' anos');
  return d > 0 ? 'em ' + t : 'há ' + t;
}
function idade(nasc) {
  const n = dt(nasc); if (!n) return ''; const h = new Date();
  let m = (h.getFullYear() - n.getFullYear()) * 12 + h.getMonth() - n.getMonth(); if (h.getDate() < n.getDate()) m--;
  if (m < 0) return ''; const a = Math.floor(m / 12), r = m % 12;
  if (!a && !r) { const d = -diasAte(nasc); return d + (d === 1 ? ' dia' : ' dias'); }
  return [a ? a + (a === 1 ? ' ano' : ' anos') : '', r ? r + (r === 1 ? ' mês' : ' meses') : ''].filter(Boolean).join(' e ');
}
const idadeTexto = p => (p.nascimento && idade(p.nascimento)) || (/^\d+$/.test(p.idade || '') ? p.idade + (p.idade === '1' ? ' ano' : ' anos') : p.idade || '');
function proxAniver(nasc) { const n = dt(nasc); if (!n) return ''; const h = dt(hoje()); const a = new Date(h.getFullYear(), n.getMonth(), n.getDate()); if (a < h) a.setFullYear(a.getFullYear() + 1); return iso(a); }
const kg = p => p > 0 ? String(Math.round(p * 10) / 10).replace('.', ',') + ' kg' : '';
const juntar = (sep, ...a) => a.filter(Boolean).join(sep);
const soNum = s => String(s || '').replace(/\D/g, '');
function mCpf(s) { const n = soNum(s).slice(0, 11); let r = ''; for (let i = 0; i < n.length; i++) { if (i === 3 || i === 6) r += '.'; if (i === 9) r += '-'; r += n[i]; } return r; }
function cpfOk(s) { const n = soNum(s); if (n.length !== 11 || /^(\d)\1+$/.test(n)) return false; for (let j = 9; j <= 10; j++) { let soma = 0; for (let i = 0; i < j; i++) soma += +n[i] * (j + 1 - i); let dv = soma * 10 % 11; if (dv === 10) dv = 0; if (dv !== +n[j]) return false; } return true; }
function mTel(s) { const n = soNum(s).slice(0, 11); if (n.length <= 2) return n ? '(' + n : ''; const r = n.slice(2), c = r.length > 8 ? 5 : 4; return '(' + n.slice(0, 2) + ') ' + (r.length <= c ? r : r.slice(0, c) + '-' + r.slice(c)); }

/* ===================================================================== consultas */
const pets = () => [...E.pets].sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
const pet = id => E.pets.find(p => p.id == id);

const foiAoVet = r => ['consulta','vacina','procedimento','exame'].includes(r.tipo);

function qrSvg(texto, px) {

const chipVal = (raiz, nome) => { const c = raiz.querySelector(`[data-chips="${nome}"] .chip.on`); return c ? c.dataset.v : ''; };

function lerFoto(file) {
  const fr = new FileReader(); fr.onload = () => {
    const img = new Image(); img.onload = () => {
      const l = Math.min(img.width, img.height), t = 360, c = document.createElement('canvas'); c.width = c.height = t;

  h += chips('fVac', [['todas', 'Todas'], ['atrasadas', '⚠️ Atrasadas'], ['breve', 'Vencem em 30 dias'], ['emdia', '✅ Em dia']], fVac); let n = 0;
  for (const p of pets()) { if (filtroPet && p.id != filtroPet) continue;
    const vs = vacinasAtuais(p.id).filter(v => { const d = v.proxima ? diasAte(v.proxima) : 9999; return ({ atrasadas: d < 0, breve: d >= 0 && d <= 30, emdia: d > 30 }[fVac] ?? true) && (!q || (v.titulo + ' ' + p.nome).toLowerCase().includes(q)); });
    if (!vs.length) continue; n += vs.length;
    h += `<div class="row" style="margin-top:20px"><div style="width:34px;height:34px">${avatar(p, 34)}</div><h3 class="grow" style="margin:0">${esc(p.nome)}</h3><button class="btn sm" data-act="novoReg" data-id="${p.id}" data-v="vacina">+ Vacina</button></div><div class="grid g2" style="margin-top:4px">`;
    h += vs.map(v => { const [s, c] = statusVac(v); return `<div class="item click" data-act="detalhe" data-id="${v.id}"><div class="grow"><div class="t">💉 ${esc(v.titulo || 'Vacina')}</div><div class="m">Aplicada em ${br(v.data)}${v.proxima ? ' · próxima ' + br(v.proxima) : ''}</div></div><span class="tag" style="color:${c};background:color-mix(in srgb,${c} 14%,transparent)">${esc(s)}</span></div>`; }).join('') + '</div>';
  }
  return h + (n ? '' : `<div class="empty">${fVac === 'atrasadas' ? 'Nenhuma vacina atrasada 🎉' : 'Nenhuma vacina neste filtro 💉'}</div>`);
}
function telaAjustes() {
  return `<div class="top"><h1 class="grow">Ajustes</h1></div><div class="grid g2" style="margin-top:12px">
    <div class="card"><h3>💾 Backup</h3><p class="sub">Salve uma cópia de todos os dados (inclusive fotos). O arquivo é o mesmo do app Android: dá para levar os dados do celular para o site e vice-versa.</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn pri sm" data-act="exportar">Baixar backup</button><button class="btn sm" data-act="copiarBackup">Copiar backup</button><button class="btn sm" data-act="importar">Restaurar de arquivo</button></div></div>
    <div class="card"><h3>🎨 Tema</h3>${chips('tema', [['sistema', 'Igual ao aparelho'], ['light', 'Claro'], ['dark', 'Escuro']], E.tema || 'sistema')}</div>
    <div class="card"><h3>🔗 Integração</h3><p class="sub">Os dados ficam neste navegador por enquanto. Para sincronizar com o app e outros aparelhos, conecte a sua API no objeto <b>Integracao</b> (início do script).</p></div>
    <div class="card"><h3>🧹 Apagar dados deste navegador</h3><p class="sub">Remove tudo que está salvo aqui. Faça um backup antes.</p><button class="btn bad sm" data-act="apagarTudo">Apagar tudo</button></div></div>`;
}
function exportarJson() {
  return JSON.stringify({ app: 'AnjosDeFocinho', versao: 1, pets: E.pets, registros: E.registros, lembretes: E.lembretes, fotos: Object.fromEntries(Object.entries(E.fotos).filter(([k]) => E.pets.some(p => p.foto === k)).map(([k, v]) => [k, v.split(',')[1]])) });
}
function importarJson(txt) {
  const o = JSON.parse(txt); if (!o.pets) throw new Error('Arquivo não é um backup do Anjos de Focinho');
  E.pets = o.pets; E.registros = o.registros || []; E.lembretes = o.lembretes || []; E.fotos = {};
  for (const [k, v] of Object.entries(o.fotos || {})) E.fotos[k] = v.startsWith('data:') ? v : 'data:image/jpeg;base64,' + v;
  salvar();
}
function csv() {
  const c = s => { s = String(s || '').replace(/\n/g, ' ').replace(/"/g, "'"); return s.includes(';') ? '"' + s + '"' : s; };
  return '﻿Data;Dog;Tipo;Descrição;Clínica;Procedimento;Valor;Plano\n' + gastosFiltrados().map(r => [br(r.data), c(pet(r.petId)?.nome), NOMES[ti(r.tipo)], c(juntar(' - ', r.titulo, r.descricao)), c(r.clinica), c(r.procedimento), (r.valor / 100).toFixed(2).replace('.', ','), r.plano ? 'Sim' : 'Não'].join(';')).join('\n');
}

/* ===================================================================== ações (cliques) */
const ACT = {
  filtro: el => { filtroPet = +el.dataset.id; render(); },
  feito: el => { const l = E.lembretes.find(x => x.id == el.dataset.id); if (l) { marcarFeito(l); toast(l.repetirDias ? 'Feito! Próximo em ' + br(l.data) : 'Feito ✅'); render(); } },
  editarLembrete: el => { const l = E.lembretes.find(x => x.id == el.dataset.id); if (l) formLembrete(l); },
  novoLembrete: el => { const id = +el.dataset.id || filtroPet; if (id) formLembrete(null, id); else escolherPet('Lembrete para qual dog?', pid => formLembrete(null, pid)); },
  escolherFoto: () => $('#arquivo').click(),
  tirarFoto: () => { fotoForm = ''; $('#fFoto').innerHTML = avatar({}, 96); },
  excluirPet: el => { const p = pet(el.dataset.id); confirmar('Excluir ' + p.nome + '?', 'O cadastro, o histórico e os lembretes deste pet serão apagados.', 'Excluir', () => { delete E.fotos[p.foto]; E.pets = E.pets.filter(x => x !== p); E.registros = E.registros.filter(r => r.petId != p.id); E.lembretes = E.lembretes.filter(l => l.petId != p.id); salvar(); ir('inicio'); }); },
  aba: el => { abaPet = el.dataset.v; render(); },
  mais: el => { const id = +el.dataset.id;
    if (abaPet === 'vacinas') return formRegistro({ petId: id, tipo: 'vacina' }); if (abaPet === 'saude') return formRegistro({ petId: id, tipo: 'peso' });
    if (abaPet === 'lembretes') return formLembrete(null, id); if (abaPet === 'ficha') return ir('editar-' + id);
    modal(`<h3>Adicionar ao histórico</h3>${TIPOS.map((t, i) => `<div class="item click" data-t="${t}"><div class="emo" style="border-color:${COR[i]};background:${COR[i]}22">${EMO[i]}</div><div class="grow t" style="align-self:center">${NOMES[i]}</div></div>`).join('')}<div class="acts"><button class="btn" data-x>Cancelar</button></div>`, b => { b.querySelector('[data-x]').onclick = fechar; b.querySelectorAll('[data-t]').forEach(x => x.onclick = () => formRegistro({ petId: id, tipo: x.dataset.t })); }); },
  novoReg: el => formRegistro({ petId: +el.dataset.id, tipo: el.dataset.v }),
  detalhe: el => { const r = E.registros.find(x => x.id == el.dataset.id); if (r) detalhe(r); },
  verGastos: el => { filtroPet = +el.dataset.id; fGastos.periodo = 'tudo'; ir('gastos'); },
  qrColeira: () => qrColeira(pet(rota().slice(4))),
  compartilhar: () => { const p = pet(rota().slice(4)); modal(`<h3>${esc(p.nome)}</h3>
      <div class="item click" data-o="c"><div class="grow t">🪪 Ver carteirinha com QR code</div></div><div class="item click" data-o="q"><div class="grow t">🏷️ QR code para a coleira</div></div>
      <div class="item click" data-o="i"><div class="grow t">🖨️ Imprimir ficha completa</div></div><div class="item click" data-o="t"><div class="grow t">💬 Copiar resumo (WhatsApp)</div></div><div class="acts"><button class="btn" data-x>Fechar</button></div>`, b => {
      b.querySelector('[data-x]').onclick = fechar;
      b.querySelectorAll('[data-o]').forEach(x => x.onclick = () => { const o = x.dataset.o; if (o === 'c') { abaPet = 'ficha'; render(); } else if (o === 'q') qrColeira(p); else if (o === 'i') { abaPet = 'ficha'; render(); setTimeout(() => { try { print(); } catch (e) {} }, 300); } else { copiar(resumoTexto(p)); fechar(); } }); }); },
  imprimir: () => { try { print(); } catch (e) { toast('Abra o sistema fora desta prévia para imprimir'); } },
  copiarResumo: el => copiar(resumoTexto(pet(el.dataset.id))),
  cat: el => { fGastos.cat = el.dataset.v; render(); },
  csv: () => { const t = csv(); baixar('Gastos_AnjosDeFocinho.csv', t, 'text/csv'); copiar(t.slice(1)); },
  novoGasto: () => escolherPet('Gasto de qual dog?', pid => modal(`<h3>Tipo do gasto</h3>${TIPOS.filter(t => t !== 'peso').map(t => `<div class="item click" data-t="${t}"><div class="emo" style="border-color:${COR[ti(t)]};background:${COR[ti(t)]}22">${EMO[ti(t)]}</div><div class="grow t" style="align-self:center">${NOMES[ti(t)]}</div></div>`).join('')}<div class="acts"><button class="btn" data-x>Cancelar</button></div>`, b => { b.querySelector('[data-x]').onclick = fechar; b.querySelectorAll('[data-t]').forEach(x => x.onclick = () => formRegistro({ petId: pid, tipo: x.dataset.t })); })),
  exportar: () => { baixar('AnjosDeFocinho_backup_' + hoje() + '.json', exportarJson(), 'application/json'); toast('Backup gerado 💾'); },
  copiarBackup: () => copiar(exportarJson()),
  importar: () => $('#arquivoBackup').click(),
  apagarTudo: () => confirmar('Apagar todos os dados?', 'Isso remove pets, histórico e lembretes deste navegador.', 'Apagar tudo', () => { E = { pets: [], registros: [], lembretes: [], fotos: {}, proxId: 1, tema: E.tema }; salvar(); ir('inicio'); })
};

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go && !e.target.closest('[data-act]')) { e.preventDefault(); return ir(go.dataset.go); }
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) { e.preventDefault(); e.stopPropagation(); return ACT[a.dataset.act](a); }
  const ch = e.target.closest('.chip'); const grupo = ch && ch.closest('[data-chips]'); if (!grupo || grupo.closest('.modal')) return;
  const n = grupo.dataset.chips, v = ch.dataset.v;
  if (['sexo', 'porte', 'estado'].includes(n)) { const on = ch.classList.contains('on'); grupo.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); if (!(on && n !== 'estado')) ch.classList.add('on'); return; }
  if (n === 'abaPet') abaPet = v; else if (n === 'filtroTipo') filtroTipo = v; else if (n === 'periodo') fGastos.periodo = v; else if (n === 'cat') fGastos.cat = v;
  else if (n === 'fLemb') fLemb = v; else if (n === 'fVac') fVac = v; else if (n === 'tema') { E.tema = v; salvar(); }
  render();
});
document.addEventListener('submit', e => { if (e.target.id === 'formPet') { e.preventDefault(); salvarPet(); } });
document.addEventListener('input', e => {
  if (e.target.id === 'busca') { busca = e.target.value; const pos = e.target.selectionStart; render(); const b = $('#busca'); if (b) { b.focus(); b.setSelectionRange(pos, pos); } }
  if (e.target.id === 'qLista') { qLista = e.target.value; const pos = e.target.selectionStart; render(); const b = $('#qLista'); if (b) { b.focus(); b.setSelectionRange(pos, pos); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
$('#arquivo').addEventListener('change', e => { if (e.target.files[0]) lerFoto(e.target.files[0]); e.target.value = ''; });
$('#arquivoBackup').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => confirmar('Restaurar backup?', 'Os dados atuais serão substituídos pelos do arquivo.', 'Restaurar', () => { try { importarJson(fr.result); toast('Backup restaurado 🐾'); ir('inicio'); } catch (err) { toast('Arquivo inválido: ' + err.message); } }); fr.readAsText(f); e.target.value = ''; });
addEventListener('hashchange', () => { const r = rota(); if (r.startsWith('pet-') && render.ultimo !== r) { abaPet = 'historico'; filtroTipo = 'todos'; } if (['gastos', 'lembretes', 'vacinas'].includes(r) && render.ultimo !== r) qLista = ''; render.ultimo = r; render(); });

carregar(); render.ultimo = rota(); render();
}
</script>
</body>
</html>
