plugins {
    id 'com.android.application'
}

android {
    namespace 'com.victorlanes.focinhos'
    compileSdk 36

    defaultConfig {
        applicationId 'com.victorlanes.focinhos'
        minSdk 26
        targetSdk 36
        def runNumber = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
        versionCode Integer.parseInt(runNumber)
        versionName '1.0.' + runNumber
    }

    // Chave fixa: as novas versões instalam por cima sem perder os cadastros
    signingConfigs {
        app {
            storeFile file('focinhos.keystore')
            storePassword 'focinhos123'
            keyAlias 'focinhos'
            keyPassword 'focinhos123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.app }
        release {
            signingConfig signingConfigs.app
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // gerador de QR code (biblioteca pura em Java, ~500 KB)
    implementation 'com.google.zxing:core:3.5.3'
}
